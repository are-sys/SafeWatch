services:
  - type: web
    name: safewatch
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: SafeWatch
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        value: base64:mW1RosyZ1DROfnVAOJ2LVsE7PwKu06+FwuWqvSLwk38=
      - key: DB_CONNECTION
        value: mongodb
      - key: DB_DATABASE
        value: shieldtech
      - key: DB_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        value: base64:mW1RosyZ1DROfnVAOJ2LVsE7PwKu06+FwuWqvSLwk38=
